# 口袋營養獅 主編後台（Decap CMS）設定
# 後台網址：<網站網址>/admin/
#
# 上線前需要確認的兩個值（見 README「後台登入設定」）：
#   repo      ：網站程式碼所在的 GitHub 儲存庫
#   base_url  ：GitHub 登入用的小服務網址（OAuth proxy）
backend:
  name: github
  repo: codare2026/codare_landing_v1
  branch: main
  # base_url: https://<你的登入服務>.workers.dev
  commit_messages:
    create: "新增{{collection}}：{{slug}}"
    update: "更新{{collection}}：{{slug}}"
    delete: "刪除{{collection}}：{{slug}}"
    uploadMedia: "上傳圖片：{{path}}"
    deleteMedia: "刪除圖片：{{path}}"

# 在自己電腦上測試後台時使用（npm run cms），上線後不影響
local_backend: true

locale: zh_Hant
site_url: https://codare2026.github.io/codare_landing_v1
display_url: https://codare2026.github.io/codare_landing_v1
logo_url: https://codare2026.github.io/codare_landing_v1/assets/img/logo.png

media_folder: src/assets/uploads
public_folder: /assets/uploads

collections:
  # ---------------- 文章 ----------------
  - name: articles
    label: 文章
    label_singular: 文章
    description: 營養師的 SEO 文與衛教文。上架前請確認：已附參考資料、沒有疾病與療效字眼。
    folder: src/articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    summary: "{{title}}　·　{{date | date('YYYY.MM.DD')}}"
    sortable_fields:
      default: { field: date, direction: descending }
      fields: [date, title]
    fields:
      - { label: 標題, name: title, widget: string }
      - label: 網址代稱
        name: url_slug
        widget: string
        required: false
        pattern: ["^[a-z0-9-]*$", "只能用小寫英文、數字和連字號，例如 smart-carb-choice"]
        hint: 用在文章網址，例如 smart-carb-choice。留空會用日期當網址。
      - label: 類型
        name: type
        widget: select
        options: ["SEO 文", "衛教文"]
        default: "SEO 文"
      - label: 閱讀主題
        name: topic
        widget: relation
        collection: settings
        file: topics
        search_fields: ["topics.*.name"]
        display_fields: ["topics.*.name"]
        value_field: "topics.*.slug"
      - label: 作者
        name: author
        widget: relation
        collection: team
        search_fields: [name]
        display_fields: [name]
        value_field: id
        required: false
        hint: 從營養師名單選擇；留空會顯示「口袋營養獅營養師團隊」
      - label: 所屬專欄
        name: column
        widget: relation
        collection: columns
        search_fields: [name]
        display_fields: [name]
        value_field: id
        required: false
      - { label: 發布日期, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: 最後更新日期, name: updated, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: 設為首頁精選, name: featured, widget: boolean, default: false, hint: 首頁大圖會顯示最新一篇「精選」文章 }
      - { label: 封面照片, name: cover, widget: image, required: false }
      - { label: 照片說明（替代文字）, name: cover_alt, widget: string, required: false, hint: 一句話描述照片內容，對 SEO 與視障讀者都有幫助 }
      - { label: 摘要, name: excerpt, widget: text, hint: 顯示在文章列表與首頁，約 50 字 }
      - { label: 內文, name: body, widget: markdown, hint: 可以直接從 Google 文件複製貼上 }
      - label: 參考資料
        name: references
        widget: list
        required: false
        fields:
          - { label: 名稱, name: title, widget: string }
          - { label: 網址, name: url, widget: string, required: false }
      - { label: SEO 搜尋標題, name: seo_title, widget: string, required: false, hint: 建議 30 字內；留空會用文章標題 }
      - { label: SEO 描述, name: seo_description, widget: text, required: false, hint: 建議 80 字內；留空會用摘要 }
      - { label: 關鍵字, name: keywords, widget: string, required: false, hint: 用逗號分隔 }
      - { label: 草稿（不公開）, name: draft, widget: boolean, default: false }
      - { label: 主編備註（不會顯示在網站）, name: editor_note, widget: text, required: false }

  # ---------------- 營養師名單 ----------------
  - name: team
    label: 營養師名單
    label_singular: 營養師
    folder: src/team
    create: true
    identifier_field: name
    slug: "{{fields.id}}"
    fields:
      - { label: 名字, name: name, widget: string, hint: 例如 海獅營養師 }
      - label: 英文代稱
        name: id
        widget: string
        pattern: ["^[a-z0-9-]+$", "只能用小寫英文、數字和連字號"]
        hint: 用在作者頁網址，例如 sealion。建立後請不要再改。
      - { label: 職稱, name: role, widget: string, default: 營養師 }
      - { label: 插畫或照片, name: avatar, widget: image, hint: 請用去背的 PNG }
      - { label: 排列順序, name: order, widget: number, value_type: int, default: 9 }
      - { label: 學歷, name: education, widget: string, required: false }
      - { label: 專長, name: specialty, widget: string, required: false, hint: 用「、」分隔，例如 運動營養、體態管理 }
      - { label: 一句招呼語, name: greeting, widget: string, required: false, hint: 會顯示在插畫旁的對話框 }
      - { label: 自我介紹, name: body, widget: markdown }

  # ---------------- 專欄管理 ----------------
  - name: columns
    label: 專欄管理
    label_singular: 專欄
    folder: src/columns
    create: true
    identifier_field: name
    slug: "{{fields.id}}"
    fields:
      - { label: 專欄名稱, name: name, widget: string }
      - label: 英文代稱
        name: id
        widget: string
        pattern: ["^[a-z0-9-]+$", "只能用小寫英文、數字和連字號"]
      - { label: 專欄作者, name: author, widget: relation, collection: team, search_fields: [name], display_fields: [name], value_field: id }
      - { label: 專欄介紹, name: description, widget: text }

  # ---------------- 活動花絮 ----------------
  - name: events
    label: 活動花絮
    label_singular: 花絮
    folder: src/events
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    summary: "{{title}}　·　{{date | date('YYYY.MM.DD')}}"
    sortable_fields:
      default: { field: date, direction: descending }
      fields: [date, title]
    fields:
      - { label: 活動名稱, name: title, widget: string }
      - { label: 類型, name: kind, widget: select, options: ["講座", "活動", "品牌合作"], default: "講座" }
      - { label: 活動日期, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: 地點, name: location, widget: string, required: false }
      - { label: 合作單位, name: partner, widget: string, required: false }
      - { label: 封面照片, name: cover, widget: image, required: false }
      - label: 更多照片
        name: gallery
        widget: list
        required: false
        fields:
          - { label: 照片, name: image, widget: image }
          - { label: 說明, name: caption, widget: string, required: false }
      - { label: 活動紀錄, name: body, widget: markdown, required: false }
      - { label: 草稿（不公開）, name: draft, widget: boolean, default: false }

  # ---------------- 網站設定 ----------------
  - name: settings
    label: 網站設定
    editor: { preview: false }
    files:
      - name: site
        label: 網站文字與聯絡資訊
        file: src/_data/site.json
        fields:
          - { label: 網站名稱, name: name, widget: string }
          - { label: 英文名稱, name: name_en, widget: string }
          - { label: 網站標語, name: tagline, widget: string }
          - { label: 網站描述（SEO）, name: description, widget: text }
          - { label: 網站網址, name: url, widget: string, hint: 不要以 / 結尾 }
          - { label: 關於我們介紹, name: about_intro, widget: text }
          - { label: 首頁精選標籤, name: home_hero_note, widget: string }
          - { label: LINE 顯示名稱, name: line_id, widget: string }
          - { label: LINE 連結, name: line_url, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: 服務時間, name: hours, widget: string }
          - { label: 服務方式, name: method, widget: string }
          - { label: 線上報名連結, name: signup_url, widget: string }
          - { label: 學員登入連結, name: login_url, widget: string }
          - { label: 免責提醒, name: disclaimer, widget: text }
          - label: 健康陪跑計畫
            name: runwith
            widget: object
            fields:
              - { label: 開場文字, name: lead, widget: text }
              - label: 三個步驟
                name: steps
                widget: list
                fields:
                  - { label: 標題, name: title, widget: string }
                  - { label: 說明, name: text, widget: string }
              - { label: 文章結尾邀請文字, name: article_invite, widget: string }
              - label: 常見問題
                name: faq
                widget: list
                fields:
                  - { label: 問題, name: q, widget: string }
                  - { label: 回答, name: a, widget: text }
          - label: 講座合作
            name: collab
            widget: object
            fields:
              - { label: 標題, name: title, widget: string }
              - { label: 說明, name: text, widget: text }
          - { label: 編輯原則, name: principles, widget: list, field: { label: 原則, name: item, widget: string } }
      - name: topics
        label: 閱讀主題
        file: src/_data/topics.json
        fields:
          - label: 主題
            name: topics
            widget: list
            fields:
              - { label: 主題名稱, name: name, widget: string }
              - label: 英文代稱
                name: slug
                widget: string
                pattern: ["^[a-z0-9-]+$", "只能用小寫英文、數字和連字號"]
                hint: 用在主題網址。已經有文章的主題請不要改。
              - { label: 一句話說明, name: desc, widget: string }
      - name: partners
        label: 合作夥伴
        file: src/_data/partners.json
        fields:
          - label: 合作夥伴
            name: partners
            widget: list
            fields:
              - { label: 名稱, name: name, widget: string }
              - { label: Logo, name: logo, widget: image, required: false, hint: 放上前請先取得對方同意 }
              - { label: 網址, name: url, widget: string, required: false }
